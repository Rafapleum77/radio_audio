<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolhas de Ações · Rádio Bitcoin</title>
<meta name="description" content="Visualizador animado de 25 ações americanas em tempo real — bolhas com física, glow neon e gráficos. Rádio Bitcoin.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg1:#0a0e27; --bg2:#0f1228; --cyan:#00e5ff; --green:#00e08a; --red:#ff4d6d;
    --purple:#a06bff; --card:rgba(255,255,255,.05); --stroke:rgba(255,255,255,.12);
    --text:#e8ecf4; --dim:#8b93a7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #16204a 0%, var(--bg1) 45%, var(--bg2) 100%);
    color:var(--text); overflow:hidden;
  }
  .wrap{display:flex;flex-direction:column;height:100vh}
  /* ===== HEADER ===== */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;background:rgba(10,14,39,.6);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--stroke);z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .brand small{font-weight:400;color:var(--dim);font-size:11px;letter-spacing:1px}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--stroke)}
  .status .led{width:9px;height:9px;border-radius:50%}
  .led.real{background:var(--green);box-shadow:0 0 10px var(--green)}
  .led.demo{background:#ffcc44;box-shadow:0 0 10px #ffcc44}
  .clock{font-size:11px;color:var(--dim)}
  button.btn{
    background:var(--card);border:1px solid var(--stroke);color:var(--text);
    padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12px;transition:.15s;display:flex;align-items:center;gap:6px
  }
  button.btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.25)}
  button.btn.active{background:rgba(0,229,255,.15);border-color:var(--cyan);color:var(--cyan)}
  .fav-count{background:var(--purple);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}
  /* ===== CONTROLS ===== */
  .controls{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 18px;background:rgba(15,18,40,.4);border-bottom:1px solid var(--stroke);z-index:4
  }
  .controls .sep{width:1px;height:22px;background:var(--stroke);margin:0 4px}
  select.sel{background:var(--bg2);border:1px solid var(--stroke);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
  .chip{font-size:11px;padding:5px 11px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);cursor:pointer;transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--purple)}
  .chip.on{background:rgba(160,107,255,.18);border-color:var(--purple);color:#d7c4ff}
  .chip b{opacity:.6;font-weight:400;margin-left:4px}
  /* ===== ANALYTICS BAR ===== */
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--stroke);background:rgba(10,14,39,.35);z-index:3}
  .stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:7px 12px}
  .stat .k{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
  .stat .v{font-size:16px;font-weight:700;margin-top:2px}
  .v.up{color:var(--green)} .v.down{color:var(--red)}
  /* ===== CANVAS ===== */
  .stage{position:relative;flex:1;min-height:0}
  canvas#bubbles{display:block;width:100%;height:100%;cursor:pointer}
  .empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:14px;text-align:center;padding:20px}
  /* ===== TOOLTIP ===== */
  #tip{position:fixed;pointer-events:none;z-index:20;background:rgba(8,11,28,.95);border:1px solid var(--stroke);border-radius:10px;padding:9px 12px;font-size:12px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);min-width:160px}
  #tip .s{font-weight:700;font-size:13px} #tip .n{color:var(--dim);font-size:11px;margin:2px 0 6px}
  #tip .row{display:flex;justify-content:space-between;gap:16px;font-size:11px;margin-top:2px}
  /* ===== MODAL ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,18,.72);backdrop-filter:blur(6px);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
  .modal{width:min(680px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#111633,#0b0f24);border:1px solid var(--stroke);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .modal-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:linear-gradient(160deg,#111633,#0b0f24);z-index:2}
  .modal-h .logo{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;color:#111}
  .modal-h .logo img{width:80%;height:80%;object-fit:contain}
  .modal-h h2{font-size:20px} .modal-h .sub{color:var(--dim);font-size:12px}
  .modal-h .px{margin-left:auto;text-align:right}
  .modal-h .px .p{font-size:22px;font-weight:800} .modal-h .px .c{font-size:13px;font-weight:700}
  .x{position:absolute;top:14px;right:16px;font-size:22px;color:var(--dim);cursor:pointer;background:none;border:none}
  .modal-b{padding:16px 20px}
  .periods{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .periods .chip.on{background:rgba(0,229,255,.16);border-color:var(--cyan);color:var(--cyan)}
  .chart-box{position:relative;height:220px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
  .info{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:10px 12px}
  .info .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .info .v{font-size:15px;font-weight:700;margin-top:3px}
  .modal-foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn-fav{flex:1;min-width:160px;justify-content:center;padding:11px;font-size:13px}
  .btn-fav.on{background:linear-gradient(90deg,#a06bff,#ff4d6d);border-color:transparent;color:#fff}
  footer{padding:6px 18px;font-size:10px;color:var(--dim);text-align:center;border-top:1px solid var(--stroke);background:rgba(10,14,39,.4)}
  @media(max-width:640px){
    .stats{overflow-x:auto} .stat{min-width:120px} .brand small{display:none}
    header,.controls{padding-left:12px;padding-right:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- HEADER -->
  <header>
    <div class="brand"><span class="dot"></span>BOLHAS DE AÇÕES <small>· Rádio Bitcoin</small></div>
    <div class="spacer"></div>
    <div class="status"><span class="led demo" id="led"></span><span id="statusTxt">iniciando…</span></div>
    <span class="clock" id="clock">—</span>
    <button class="btn" id="tabAll">Todas</button>
    <button class="btn" id="tabFav">★ Favoritos <span class="fav-count" id="favCount">0</span></button>
    <button class="btn" id="refreshBtn" title="Atualizar agora">⟳</button>
    <button class="btn" id="exportBtn" title="Exportar CSV">⤓ CSV</button>
  </header>

  <!-- CONTROLS -->
  <div class="controls" id="controls">
    <span style="font-size:11px;color:var(--dim)">Ordenar:</span>
    <select class="sel" id="sortSel">
      <option value="change_desc">Maior ganho</option>
      <option value="change_asc">Maior perda</option>
      <option value="mcap_desc">Market cap</option>
      <option value="price_desc">Preço</option>
      <option value="name_asc">Nome (A-Z)</option>
    </select>
    <span class="sep"></span>
    <div id="sectorChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>

  <!-- ANALYTICS -->
  <div class="stats" id="stats"></div>

  <!-- STAGE -->
  <div class="stage">
    <canvas id="bubbles"></canvas>
    <div class="empty" id="empty">Nenhuma ação neste filtro.<br>Adicione favoritos clicando em ★ dentro de uma ação.</div>
  </div>

  <footer id="footer">Dados podem ter atraso. Não é recomendação de investimento. · radiobitcoin.org</footer>
</div>

<!-- TOOLTIP -->
<div id="tip"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-h">
      <div class="logo" id="mLogo"></div>
      <div><h2 id="mSym"></h2><div class="sub" id="mName"></div></div>
      <div class="px"><div class="p" id="mPrice"></div><div class="c" id="mChange"></div></div>
      <button class="x" id="mClose">✕</button>
    </div>
    <div class="modal-b">
      <div class="periods" id="periods">
        <span class="chip" data-r="1D">1D</span><span class="chip on" data-r="1W">1W</span>
        <span class="chip" data-r="1M">1M</span><span class="chip" data-r="3M">3M</span>
        <span class="chip" data-r="6M">6M</span><span class="chip" data-r="1Y">1Y</span>
      </div>
      <div class="chart-box"><canvas id="modalChart"></canvas></div>
      <div class="info-grid">
        <div class="info"><div class="k">Setor</div><div class="v" id="mSector"></div></div>
        <div class="info"><div class="k">Market Cap</div><div class="v" id="mMcap"></div></div>
        <div class="info"><div class="k">RSI (14)</div><div class="v" id="mRsi"></div></div>
        <div class="info"><div class="k">Tendência</div><div class="v" id="mTrend"></div></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-fav" id="mFav">★ Adicionar aos favoritos</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   BOLHAS DE AÇÕES — Rádio Bitcoin (vanilla JS + Canvas + Chart.js)
   Auto-contido, sem build. Deploy direto no GitHub Pages.
   ============================================================ */

// ---- Metadados das 25 ações (nome, setor, mcap ~, seed de preço, logo) ----
const L = 'https://upload.wikimedia.org/wikipedia/commons/';
const META = {
  AAPL:{n:'Apple Inc.',s:'Technology',mc:3400,p:225,logo:L+'f/fa/Apple_logo_black.svg'},
  MSFT:{n:'Microsoft',s:'Technology',mc:3300,p:440,logo:L+'9/96/Microsoft_logo_%282012%29.svg'},
  GOOGL:{n:'Alphabet (Google)',s:'Technology',mc:2100,p:175,logo:L+'2/2f/Google_2015_logo.svg'},
  NVDA:{n:'NVIDIA',s:'Technology',mc:3200,p:130,logo:L+'2/21/Nvidia_logo.svg'},
  META:{n:'Meta Platforms',s:'Technology',mc:1300,p:500,logo:L+'7/7b/Meta_Platforms_Inc_logo.svg'},
  IBM:{n:'IBM',s:'Technology',mc:200,p:220,logo:L+'5/51/IBM_logo.svg'},
  INTC:{n:'Intel',s:'Technology',mc:90,p:22,logo:L+'7/7d/Intel_logo_%282006-2020%29.svg'},
  AMD:{n:'AMD',s:'Technology',mc:220,p:140,logo:L+'7/7c/AMD_Logo.svg'},
  JPM:{n:'JPMorgan Chase',s:'Financial',mc:620,p:210,logo:L+'1/1d/JPMorgan_Chase_Logo_2008_1.svg'},
  V:{n:'Visa',s:'Financial',mc:560,p:275,logo:L+'5/5e/Visa_Inc._logo.svg'},
  MA:{n:'Mastercard',s:'Financial',mc:420,p:470,logo:L+'0/04/Mastercard-logo.png'},
  JNJ:{n:'Johnson & Johnson',s:'Healthcare',mc:380,p:155,logo:L+'0/0a/Johnson_%26_Johnson_Logo.svg'},
  UNH:{n:'UnitedHealth',s:'Healthcare',mc:480,p:520,logo:''},
  AMZN:{n:'Amazon',s:'Consumer Cyclical',mc:2100,p:200,logo:L+'a/a9/Amazon_logo.svg'},
  TSLA:{n:'Tesla',s:'Consumer Cyclical',mc:800,p:250,logo:L+'e/e8/Tesla_logo.png'},
  HD:{n:'Home Depot',s:'Consumer Cyclical',mc:380,p:380,logo:L+'5/5f/TheHomeDepot.svg'},
  MCD:{n:"McDonald's",s:'Consumer Cyclical',mc:210,p:290,logo:L+'a/ab/McDonald%27s_Golden_Arches.svg'},
  WMT:{n:'Walmart',s:'Consumer Defensive',mc:620,p:80,logo:L+'c/ca/Walmart_logo.svg'},
  PG:{n:'Procter & Gamble',s:'Consumer Defensive',mc:380,p:165,logo:L+'8/85/Procter_%26_Gamble_logo.svg'},
  KO:{n:'Coca-Cola',s:'Consumer Defensive',mc:280,p:62,logo:L+'c/ce/Coca-Cola_logo.svg'},
  BA:{n:'Boeing',s:'Industrials',mc:130,p:180,logo:L+'4/4e/Boeing_full_logo.svg'},
  CAT:{n:'Caterpillar',s:'Industrials',mc:170,p:340,logo:''},
  XOM:{n:'ExxonMobil',s:'Energy',mc:480,p:115,logo:L+'2/25/ExxonMobil_Logo.svg'},
  CVX:{n:'Chevron',s:'Energy',mc:280,p:155,logo:L+'6/6b/Chevron_Logo.svg'},
  DIS:{n:'Disney',s:'Communication',mc:200,p:95,logo:L+'3/3e/Disney%2B_logo.svg'},
};
const SYMBOLS = Object.keys(META);
const SECTOR_EMOJI = {Technology:'💻',Financial:'🏦',Healthcare:'🩺','Consumer Cyclical':'🛍️','Consumer Defensive':'🧴',Industrials:'🏭',Energy:'⛽',Communication:'📺'};

// ---- Estado ----
let STOCKS = {};        // symbol -> {price, prevClose, change, ...}
let bubbles = [];       // objetos de física
let usingReal = false;
let lastUpdate = null;
let activeSector = 'ALL';
let activeSort = 'change_desc';
let tab = 'all';        // 'all' | 'fav'
let favorites = JSON.parse(localStorage.getItem('rb_stock_favs')||'[]');
let modalSym = null, modalRange = '1W', modalChart = null;

// ---- Logos: preenchidos por loadFinnhubLogos() (CDN oficial da Finnhub) ----
const LOGO_IMG = {};

// ---- Dados DEMO (random walk realista) ----
function seedDemo(){
  SYMBOLS.forEach(sym=>{
    const base = META[sym].p;
    const prev = base;
    const ch = (Math.random()*6-3);           // -3% a +3%
    STOCKS[sym] = { symbol:sym, prevClose:prev, price:+(prev*(1+ch/100)).toFixed(2),
                    change:+ch.toFixed(2), mcap:META[sym].mc, sector:META[sym].s,
                    name:META[sym].n, hist:null };
  });
}
function stepDemo(){
  SYMBOLS.forEach(sym=>{
    const s = STOCKS[sym]; if(!s) return;
    const drift = (Math.random()*1.2-0.6);
    s.change = +Math.max(-9,Math.min(9,s.change+drift)).toFixed(2);
    s.price = +(s.prevClose*(1+s.change/100)).toFixed(2);
  });
}

// ---- Dados REAIS (Yahoo v8 chart via cadeia de proxies CORS, fallback demo) ----
const PROXIES = [
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+u,
];
const PROXY = PROXIES[0];  // usado pelo gráfico do modal
async function fetchVia(url){
  for(const p of PROXIES){
    try{
      const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),5000);
      const r=await fetch(p(url),{cache:'no-store',signal:ac.signal}); clearTimeout(to);
      if(r.ok){ const t=await r.text(); return JSON.parse(t); }
    }catch(e){}
  }
  return null;
}
async function fetchOne(sym){
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d';
  const j=await fetchVia(url); const m=j?.chart?.result?.[0]?.meta;
  if(!m || m.regularMarketPrice==null) return false;
  const price=m.regularMarketPrice, prev=m.previousClose||m.chartPreviousClose||price;
  const ch = prev? ((price-prev)/prev*100):0;
  STOCKS[sym] = { symbol:sym, prevClose:prev, price:+price.toFixed(2), change:+ch.toFixed(2),
                  mcap:META[sym].mc, sector:META[sym].s, name:META[sym].n, hist:null };
  return true;
}
// --- Finnhub (fonte PRINCIPAL: CORS direto, chave gratuita) ---
const FINNHUB_TOKEN='d93tvk1r01qj2ci97b5gd93tvk1r01qj2ci97b60';
async function finnhubQuote(sym){
  try{
    const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),6000);
    const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+sym+'&token='+FINNHUB_TOKEN,{signal:ac.signal}); clearTimeout(to);
    if(!r.ok) return false; const j=await r.json();
    if(j.c==null || j.c===0) return false;
    const price=j.c, prev=j.pc||price, ch=(j.dp!=null)? j.dp : (prev?((price-prev)/prev*100):0);
    STOCKS[sym]={symbol:sym,prevClose:prev,price:+price.toFixed(2),change:+ch.toFixed(2),
      mcap:META[sym].mc,sector:META[sym].s,name:META[sym].n,hist:null};
    return true;
  }catch(e){ return false; }
}
// logos oficiais via CDN direto da Finnhub (sem gastar chamada de API → não estoura o limite)
function loadFinnhubLogos(){
  const OVR={META:'FB'};  // tickers cujo arquivo difere do símbolo
  const base='https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo/';
  SYMBOLS.forEach(s=>{
    const url=base+(OVR[s]||s)+'.png';
    META[s].logo=url;
    const img=new Image();
    img.onload=(function(sy){return function(){LOGO_IMG[sy]=img;}})(s);
    img.src=url;
  });
}
// --- Yahoo (reserva) ---
async function fetchYahoo(){
  let hits=0; const q=[...SYMBOLS];
  const worker=async()=>{ while(q.length){ const s=q.shift(); try{ if(await fetchOne(s)) hits++; }catch(e){} } };
  const run=Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  await Promise.race([run, new Promise(r=>setTimeout(r,14000))]);
  return hits;
}
async function fetchReal(){
  // 1) Finnhub primeiro (rápido, CORS direto)
  let hits=0; const q=[...SYMBOLS];
  const w=async()=>{ while(q.length){ const s=q.shift(); if(await finnhubQuote(s)) hits++; } };
  const run=Promise.all([w(),w(),w(),w(),w()]);
  await Promise.race([run, new Promise(r=>setTimeout(r,12000))]);
  // 2) reserva: Yahoo via proxy
  if(hits<5) hits=await fetchYahoo();
  usingReal = hits>=5; return usingReal;
}

async function refresh(manual){
  setStatus('atualizando…', usingReal);
  const ok = await fetchReal();
  if(!ok){ if(!Object.keys(STOCKS).length) seedDemo(); else stepDemo(); }
  lastUpdate = new Date();
  syncBubbles(); renderStats(); renderSectors(); setStatus(usingReal?'Dados Reais':'Dados Demo', usingReal);
  if(modalSym && modalBg.style.display==='flex') refreshModalHeader();
}

// ---- STATUS UI ----
function setStatus(txt, real){
  statusTxt.textContent = txt;
  led.className = 'led '+(real?'real':'demo');
}
function tick(){ if(lastUpdate){ const s=Math.round((Date.now()-lastUpdate)/1000);
  clock.textContent = 'atualizado há '+(s<60? s+'s': Math.round(s/60)+'min'); } }
setInterval(tick,1000);

// ============================================================
//  FÍSICA + RENDER (Canvas)
// ============================================================
const cv = document.getElementById('bubbles'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){ const r=cv.parentElement.getBoundingClientRect(); W=r.width;H=r.height;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',()=>{resize();});

function visibleList(){
  let list = SYMBOLS.map(s=>STOCKS[s]).filter(Boolean);
  if(tab==='fav') list = list.filter(s=>favorites.includes(s.symbol));
  if(activeSector!=='ALL') list = list.filter(s=>s.sector===activeSector);
  const [k,dir] = activeSort.split('_');
  list.sort((a,b)=>{
    let va,vb;
    if(k==='change'){va=a.change;vb=b.change;}
    else if(k==='mcap'){va=a.mcap;vb=b.mcap;}
    else if(k==='price'){va=a.price;vb=b.price;}
    else {va=a.name;vb=b.name;}
    if(typeof va==='string') return dir==='asc'? va.localeCompare(vb): vb.localeCompare(va);
    return dir==='asc'? va-vb : vb-va;
  });
  return list;
}
function radiusFor(s){ const base=Math.sqrt(s.mcap); const min=26,max=64;
  const lo=Math.sqrt(30), hi=Math.sqrt(3400);
  return min + (max-min)*Math.max(0,Math.min(1,(base-lo)/(hi-lo)));
}
function syncBubbles(){
  const list = visibleList();
  const keep = {};
  list.forEach(s=>{
    let b = bubbles.find(x=>x.symbol===s.symbol);
    if(!b){ b={symbol:s.symbol, x:Math.random()*(W||600), y:Math.random()*(H||400),
      vx:(Math.random()*2-1)*.4, vy:(Math.random()*2-1)*.4}; }
    b.r = radiusFor(s); b.data=s; keep[s.symbol]=b;
  });
  bubbles = Object.values(keep);
  document.getElementById('empty').style.display = bubbles.length? 'none':'flex';
}
function physics(){
  for(const b of bubbles){
    b.x+=b.vx; b.y+=b.vy; b.vx*=.992; b.vy*=.992;
    // leve atração ao centro pra não colar nas bordas
    b.vx += (W/2-b.x)*0.00006; b.vy += (H/2-b.y)*0.00006;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)} if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)}
  }
  for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){
    const a=bubbles[i],c=bubbles[j]; let dx=c.x-a.x,dy=c.y-a.y; let d=Math.hypot(dx,dy)||.01;
    const min=a.r+c.r+4;
    if(d<min){ const f=(min-d)/d*0.5; dx*=f;dy*=f; a.x-=dx;a.y-=dy;c.x+=dx;c.y+=dy;
      a.vx-=dx*.05;a.vy-=dy*.05;c.vx+=dx*.05;c.vy+=dy*.05; }
  }
}
function drawBubble(b){
  const up = b.data.change>=0; const col = up? '0,224,138':'255,77,109';
  const glow = 8 + Math.min(18, Math.abs(b.data.change)*2.5);
  ctx.save();
  // glow
  ctx.shadowColor='rgba('+col+',0.9)'; ctx.shadowBlur=glow;
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7);
  const g=ctx.createRadialGradient(b.x,b.y-b.r*.3,b.r*.2,b.x,b.y,b.r);
  g.addColorStop(0,'rgba('+col+',0.30)'); g.addColorStop(1,'rgba('+col+',0.08)');
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  // borda neon
  ctx.lineWidth=2.2; ctx.strokeStyle='rgba('+col+',0.95)'; ctx.stroke();
  // logo
  const img=LOGO_IMG[b.symbol];
  const ls=b.r*0.9;
  if(img){ ctx.save(); ctx.beginPath(); ctx.arc(b.x,b.y-b.r*0.18,ls*0.5,0,7); ctx.clip();
    // fundo branco leve pra logos escuros
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fillRect(b.x-ls*.5,b.y-b.r*0.18-ls*.5,ls,ls);
    const ratio=Math.min(ls/img.width, ls/img.height); const w=img.width*ratio*0.86,h=img.height*ratio*0.86;
    ctx.drawImage(img,b.x-w/2,b.y-b.r*0.18-h/2,w,h); ctx.restore();
  } else {
    ctx.fillStyle='#fff'; ctx.font='700 '+Math.max(11,b.r*0.34)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.symbol.slice(0,4), b.x, b.y-b.r*0.15);
  }
  // símbolo + %
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.max(9,b.r*0.24)+'px sans-serif';
  ctx.fillText(b.symbol, b.x, b.y+b.r*0.34);
  ctx.font='700 '+Math.max(9,b.r*0.26)+'px sans-serif';
  ctx.fillStyle='rgb('+col+')';
  ctx.fillText((up?'+':'')+b.data.change.toFixed(2)+'%', b.x, b.y+b.r*0.62);
  ctx.restore();
}
function loop(){ physics(); ctx.clearRect(0,0,W,H); for(const b of bubbles) drawBubble(b); requestAnimationFrame(loop); }

function bubbleAt(mx,my){ for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i];
  if(Math.hypot(mx-b.x,my-b.y)<=b.r) return b; } return null; }
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(); const b=bubbleAt(e.clientX-r.left,e.clientY-r.top);
  const tip=document.getElementById('tip');
  if(b){ cv.style.cursor='pointer'; const s=b.data; const up=s.change>=0;
    tip.style.display='block'; tip.style.left=Math.min(e.clientX+14,innerWidth-190)+'px'; tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML='<div class="s">'+s.symbol+(favorites.includes(s.symbol)?' ★':'')+'</div><div class="n">'+s.name+'</div>'+
      '<div class="row"><span>Preço</span><b>$'+s.price.toFixed(2)+'</b></div>'+
      '<div class="row"><span>Variação</span><b style="color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'+':'')+s.change.toFixed(2)+'%</b></div>'+
      '<div class="row"><span>Setor</span><b>'+s.sector+'</b></div>'+
      '<div class="row"><span>Mkt Cap</span><b>$'+s.mcap+'B</b></div>';
  } else { cv.style.cursor='default'; tip.style.display='none'; }
});
cv.addEventListener('mouseleave',()=>{document.getElementById('tip').style.display='none';});
cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect(); const b=bubbleAt(e.clientX-r.left,e.clientY-r.top);
  if(b) openModal(b.symbol); });

//  MODAL + GRÁFICO
// ============================================================
const modalBg=document.getElementById('modalBg');
function synthSeries(sym,range){
  const pts={'1D':24,'1W':7*8,'1M':30,'3M':90,'6M':120,'1Y':160}[range]||60;
  const s=STOCKS[sym]; const end=s.price; let arr=[]; let v=end*(0.85+Math.random()*0.1);
  const labels=[];
  for(let i=0;i<pts;i++){ v=v*(1+(Math.random()*0.04-0.019)); arr.push(+v.toFixed(2)); labels.push(''); }
  arr[arr.length-1]=end;
  return {labels,data:arr};
}
async function realSeries(sym,range){
  const map={'1D':['5m','1d'],'1W':['30m','5d'],'1M':['1d','1mo'],'3M':['1d','3mo'],'6M':['1d','6mo'],'1Y':['1wk','1y']};
  const [interval,rng]=map[range]||['1d','1mo'];
  try{
    const url='https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval='+interval+'&range='+rng;
    const r=await fetch(PROXY(url),{cache:'no-store'}); if(!r.ok)throw 0;
    const j=await r.json(); const res=j?.chart?.result?.[0]; const q=res?.indicators?.quote?.[0]?.close;
    if(!q||!q.length)throw 0; const data=q.filter(x=>x!=null).map(x=>+x.toFixed(2));
    return {labels:data.map(()=>''),data};
  }catch(e){ return null; }
}
function rsi(data){ if(data.length<15) return null; let g=0,l=0;
  for(let i=data.length-14;i<data.length;i++){ const d=data[i]-data[i-1]; if(d>=0)g+=d;else l-=d; }
  if(l===0) return 100; const rs=(g/14)/(l/14); return Math.round(100-100/(1+rs)); }

async function openModal(sym){
  modalSym=sym; const s=STOCKS[sym]; const m=META[sym];
  modalBg.style.display='flex';
  refreshModalHeader();
  document.getElementById('mSector').textContent=(SECTOR_EMOJI[s.sector]||'')+' '+s.sector;
  document.getElementById('mMcap').textContent='$'+s.mcap+'B';
  // logo
  const lg=document.getElementById('mLogo'); lg.innerHTML='';
  if(META[sym].logo){ const im=document.createElement('img'); im.src=META[sym].logo;
    im.onerror=()=>{lg.textContent=sym.slice(0,2)}; lg.appendChild(im);} else lg.textContent=sym.slice(0,2);
  updateFavBtn();
  drawModalChart(sym, modalRange);
}
function refreshModalHeader(){ const s=STOCKS[modalSym]; if(!s)return; const up=s.change>=0;
  document.getElementById('mSym').textContent=s.symbol;
  document.getElementById('mName').textContent=s.name;
  document.getElementById('mPrice').textContent='$'+s.price.toFixed(2);
  const c=document.getElementById('mChange'); c.textContent=(up?'▲ +':'▼ ')+s.change.toFixed(2)+'%';
  c.style.color=up?'var(--green)':'var(--red)';
}
async function drawModalChart(sym,range){
  let ser = usingReal? await realSeries(sym,range):null;
  if(!ser) ser = synthSeries(sym,range);
  const up = ser.data[ser.data.length-1]>=ser.data[0];
  const col = up? '#00e08a':'#ff4d6d';
  document.getElementById('mRsi').textContent = rsi(ser.data)??'—';
  document.getElementById('mTrend').textContent = up? '📈 Alta':'📉 Baixa';
  const cx=document.getElementById('modalChart');
  if(modalChart) modalChart.destroy();
  const grad=cx.getContext('2d').createLinearGradient(0,0,0,200);
  grad.addColorStop(0, up?'rgba(0,224,138,.35)':'rgba(255,77,109,.35)'); grad.addColorStop(1,'rgba(0,0,0,0)');
  modalChart=new Chart(cx,{type:'line',data:{labels:ser.labels,datasets:[{data:ser.data,borderColor:col,
    backgroundColor:grad,fill:true,tension:.25,pointRadius:0,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>'$'+c.parsed.y}}},
      scales:{x:{display:false},y:{ticks:{color:'#8b93a7',callback:v=>'$'+v},grid:{color:'rgba(255,255,255,.05)'}}}}});
}
document.getElementById('periods').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  document.querySelectorAll('#periods .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
  modalRange=c.dataset.r; drawModalChart(modalSym,modalRange);
});
document.getElementById('mClose').onclick=()=>{modalBg.style.display='none'};
modalBg.addEventListener('click',e=>{if(e.target===modalBg)modalBg.style.display='none'});

function saveFavs(){ localStorage.setItem('rb_stock_favs',JSON.stringify(favorites)); document.getElementById('favCount').textContent=favorites.length; }
function toggleFav(sym){ const i=favorites.indexOf(sym); if(i>=0)favorites.splice(i,1); else favorites.push(sym);
  saveFavs(); updateFavBtn(); if(tab==='fav'){syncBubbles();renderStats();} }

  b.classList.toggle('on',on); b.textContent=on?'★ Remover dos favoritos':'☆ Adicionar aos favoritos'; }

function renderSectors(){
  const counts={}; SYMBOLS.forEach(s=>{const sec=META[s].s;counts[sec]=(counts[sec]||0)+1;});
  const box=document.getElementById('sectorChips'); box.innerHTML='';
  const mk=(key,label,n)=>{ const c=document.createElement('span'); c.className='chip'+(activeSector===key?' on':'');
    c.innerHTML=label+(n!=null?' <b>'+n+'</b>':''); c.onclick=()=>{activeSector=key;syncBubbles();renderSectors();renderStats();}; box.appendChild(c); };
  mk('ALL','Todos', SYMBOLS.length);
  Object.keys(counts).forEach(sec=>mk(sec,(SECTOR_EMOJI[sec]||'')+' '+sec,counts[sec]));
}
function renderStats(){
  const list=visibleList(); const gains=list.filter(s=>s.change>=0).length; const losses=list.length-gains;
  const mcap=list.reduce((a,s)=>a+s.mcap,0); const rate=list.length? Math.round(gains/list.length*100):0;
  const top=[...list].sort((a,b)=>b.change-a.change)[0];
  const el=document.getElementById('stats');
  el.innerHTML=
    stat('Ações',list.length)+
    stat('Ganhos',gains,'up')+ stat('Perdas',losses,'down')+
    stat('% Alta',rate+'%', rate>=50?'up':'down')+
    stat('Mkt Cap','$'+(mcap/1000).toFixed(1)+'T')+
    stat('Top', top? top.symbol+' '+(top.change>=0?'+':'')+top.change.toFixed(1)+'%':'—', top&&top.change>=0?'up':'down');
}
function stat(k,v,cls){ return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'; }

document.getElementById('sortSel').onchange=e=>{activeSort=e.target.value;syncBubbles();};
function setTab(t){ tab=t; document.getElementById('tabAll').classList.toggle('active',t==='all');
  document.getElementById('tabFav').classList.toggle('active',t==='fav'); syncBubbles(); renderStats(); }
document.getElementById('tabAll').onclick=()=>setTab('all');
document.getElementById('tabFav').onclick=()=>setTab('fav');
document.getElementById('refreshBtn').onclick=()=>refresh(true);
document.getElementById('exportBtn').onclick=()=>{
  const list=visibleList(); let csv='symbol,name,sector,price,change%,marketCapB\n';
  list.forEach(s=>csv+=[s.symbol,'"'+s.name+'"',s.sector,s.price,s.change,s.mcap].join(',')+'\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='acoes_radiobitcoin.csv'; a.click();
};
