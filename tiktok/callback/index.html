<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rádio Bitcoin · autorização do TikTok</title>
<style>
  :root{--bg:#0d0d0f;--card:#17171b;--linha:#2a2a31;--txt:#f2efe9;--dim:#9a938a;--btc:#f7931a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
       color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
  .card{max-width:620px;width:100%;background:var(--card);border:1px solid var(--linha);
        border-radius:14px;padding:32px}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
  .sub{color:var(--dim);margin:0 0 24px;font-size:15px}
  .rotulo{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
          margin-bottom:8px}
  code{display:block;background:#0a0a0c;border:1px solid var(--linha);border-radius:8px;
       padding:14px 16px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       word-break:break-all;color:var(--btc)}
  button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:8px;
         background:var(--btc);color:#0d0d0f;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:focus-visible{outline:2px solid var(--txt);outline-offset:2px}
  .erro{color:#e4796a}
  .passo{color:var(--dim);font-size:14px;margin-top:20px;padding-top:18px;
         border-top:1px solid var(--linha)}
</style>
</head>
<body>
  <main class="card">
    <h1>Autorização do TikTok</h1>
    <p class="sub">Página interna da Rádio Bitcoin. Copie o código abaixo e cole no terminal.</p>
    <div class="rotulo">Código de autorização</div>
    <code id="codigo">lendo…</code>
    <button id="copiar" type="button">Copiar código</button>
    <p class="passo" id="passo">Volte ao terminal e cole quando o script pedir <b>Código:</b></p>
  </main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var erro = p.get("error") || p.get("error_description");
  var alvo = document.getElementById("codigo");
  var botao = document.getElementById("copiar");

  if (erro) {
    alvo.textContent = erro;
    alvo.classList.add("erro");
    botao.disabled = true;
    document.getElementById("passo").textContent =
      "O TikTok recusou a autorização. Tente de novo pelo terminal.";
    return;
  }
  if (!code) {
    alvo.textContent = "nenhum código na URL";
    alvo.classList.add("erro");
    botao.disabled = true;
    return;
  }
  alvo.textContent = code;
  botao.addEventListener("click", function () {
    navigator.clipboard.writeText(code).then(function () {
      botao.textContent = "Copiado";
      setTimeout(function () { botao.textContent = "Copiar código"; }, 2000);
    }).catch(function () {
      botao.textContent = "Selecione o código acima e copie à mão";
    });
  });
})();
</script>
</body>
</html>
